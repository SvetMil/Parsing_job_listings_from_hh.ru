name: AutoPoster HH.ru

on:
  schedule:
    # Запуски в 01:20, 05:00 и 10:00 по UTC (что соответствует 08:20, 12:00 и 17:00 в Красноярске)
    - cron: "20 1 * * 1-5"
    - cron: "0 5 * * 1-5"
    - cron: "0 10 * * 1-5"
  workflow_dispatch: # Кнопка ручного запуска в панели GitHub

jobs:
  run-poster:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Дает право обновлять файл базы данных seen_vacancies.txt

    steps:
    - name: Клонирование репозитория
      uses: actions/checkout@v4

    - name: Настройка Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # ⚡️ Включает автоматическое кэширование зависимостей pip

    - name: Установка зависимостей
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Запуск автоматической публикации постов
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        VK_TOKEN: ${{ secrets.VK_TOKEN }}
        VK_USER_ID: ${{ secrets.VK_USER_ID }}
      run: python parser.py

    - name: Автоматическое сохранение базы данных вакансий
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # Гарантируем наличие файла, чтобы git add не упал с ошибкой
        touch seen_vacancies.txt
        
        git add seen_vacancies.txt
        git commit -m "🤖 Обновление лога отправленных вакансий [skip ci]" || exit 0
        git push origin HEAD:${{ github.ref }}
